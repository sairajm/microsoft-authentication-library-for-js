<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>iframe Window</title>
    <style>
        body {
            background-color: #D53C2F;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Hello there, i'm an iframe</h1>
    <p>Got Message:</p>
    <div id="results"></div>

    <script>
        // addEventListener support for IE8
        function bindEvent(element, eventName, eventHandler) {
            if (element.addEventListener) {
                element.addEventListener(eventName, eventHandler, false);
            } else if (element.attachEvent) {
                element.attachEvent('on' + eventName, eventHandler);
            }
        }

        var results = document.getElementById('results'),
            messageButton = document.getElementById('message_button');

        // Listen to messages from parent window
        bindEvent(window, 'message', function (e) {
            console.log('Received a call in the child iFrame');
            results.innerHTML = e.data;

            const parentDomain = "http://localhost:30662";

            if (e.origin === parentDomain) {
            const sid = e.data;

            // attempt SSO
            performSilentSSOWithinIFrame(sid);
        } else {
            console.log('Parent domain did not match what I was expecting');
        }
        });
    </script>
    <script type="text/javascript" src="./auth.js"></script>

</body>
